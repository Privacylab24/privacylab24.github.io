<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customised Preferences</title>
    <style>
        /* Same styles as before */
    </style>
    <script>
        function handleRedirection() {
            // OneTrust Magic URL
            const oneTrustUrl = "https://privacyportal-in.onetrust.com/ui/#/preferences/multipage/token/4dae8603-07e4-4c89-ae2a-c983cd841650/";

            // Current page URL
            const currentPage = window.location.href;

            // Parse the current URL to check for the "returnUrl" parameter
            const urlParams = new URLSearchParams(window.location.search);

            // If the "returnUrl" parameter is NOT present, redirect to OneTrust
            if (!urlParams.has("returnUrlHandled")) {
                // Append a marker to avoid redirection loops
                const returnUrl = encodeURIComponent(currentPage + "?returnUrlHandled=true");
                console.log("Redirecting to OneTrust with returnUrl:", returnUrl);

                // Redirect to OneTrust
                window.location.href = `${oneTrustUrl}?returnUrl=${returnUrl}`;
            } else {
                // If "returnUrlHandled" is present, proceed to load the preferences page
                console.log("Returned from OneTrust. Proceeding to load preferences...");
            }
        }

        // Handle redirection on page load
        window.onload = handleRedirection;
    </script>
</head>
<body>
    <div class="container">
        <!-- Header Section with Teal Background -->
        <div class="header-section">
            <div class="header">
                Customised preference for <span class="email">abc@xxx.com</span>
            </div>
            <div class="instruction">
                To submit your changes, click the Change Preferences button at the bottom. 
                If you have any questions, email <a href="mailto:dpr@xxx.com" style="color: #DFF5F5; text-decoration: none;">dpr@xxx.com</a>.
            </div>
        </div>

        <!-- Title -->
        <h2>Select your preferred way(s) to be contacted by a OneTrust industry expert</h2>

        <!-- Buttons for Preferences -->
        <div class="button-container">
            <div class="button selected" id="emailButton" onclick="toggleSelection('emailButton')">
                <span class="icon"></span> Email
            </div>
            <div class="button selected" id="phoneButton" onclick="toggleSelection('phoneButton')">
                <span class="icon"></span> Phone
            </div>
            <div class="button" id="whatsappButton" onclick="toggleSelection('whatsappButton')">
                <span class="icon"></span> WhatsApp
            </div>
            <div class="button" id="smsButton" onclick="toggleSelection('smsButton')">
                <span class="icon"></span> SMS/Text
            </div>
        </div>

        <!-- Submit Button -->
        <button class="submit-button" onclick="submitPreferences()">Change Preferences</button>
    </div>
    <script>
        function toggleSelection(buttonId) {
            const button = document.getElementById(buttonId);
            button.classList.toggle("selected");
        }

        function submitPreferences() {
            const emailSelected = document.getElementById('emailButton').classList.contains('selected');
            const phoneSelected = document.getElementById('phoneButton').classList.contains('selected');
            const whatsappSelected = document.getElementById('whatsappButton').classList.contains('selected');
            const smsSelected = document.getElementById('smsButton').classList.contains('selected');

            console.log('Email Preference:', emailSelected ? 'Selected' : 'Not Selected');
            console.log('Phone Preference:', phoneSelected ? 'Selected' : 'Not Selected');
            console.log('WhatsApp Preference:', whatsappSelected ? 'Selected' : 'Not Selected');
            console.log('SMS/Text Preference:', smsSelected ? 'Selected' : 'Not Selected');

            alert('Your preferences have been updated!');
        }
    </script>
</body>
</html>
